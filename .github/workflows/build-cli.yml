name: build cli

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-cli-main
  cancel-in-progress: false

jobs:
  revision:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      short: ${{ steps.sha.outputs.short }}
    steps:
      - id: sha
        run: echo "short=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

  build:
    needs: revision
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            goos: linux
            arch: arm64
          - platform: linux
            goos: linux
            arch: amd64
          - platform: macos
            goos: darwin
            arch: arm64
          - platform: windows
            goos: windows
            arch: arm64
          - platform: windows
            goos: windows
            arch: amd64
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - name: Test CLI
        working-directory: cli
        run: |
          go test -race ./...
          go vet ./...
      - name: Build and zip CLI
        working-directory: cli
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.arch }}
          PLATFORM: ${{ matrix.platform }}
          SHORT_SHA: ${{ needs.revision.outputs.short }}
        run: |
          mkdir -p ../release
          suffix=''
          if [ "$GOOS" = windows ]; then suffix='.exe'; fi
          binary="kamakura-cli$suffix"
          go build -trimpath -buildvcs=false -ldflags='-buildid=' -o "../release/$binary" .
          cd ../release
          zip "kamakura-cli-$SHORT_SHA-$PLATFORM-$GOARCH.zip" "$binary"
          rm "$binary"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cli-${{ matrix.platform }}-${{ matrix.arch }}
          path: release/*.zip
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [revision, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: cli-*
          merge-multiple: true
          path: release
      - name: Check archives and generate checksums
        working-directory: release
        run: |
          shopt -s nullglob
          archives=(kamakura-cli-*.zip)
          test "${#archives[@]}" -eq 5
          for archive in "${archives[@]}"; do unzip -t "$archive"; done
          sha256sum "${archives[@]}" > SHA256SUMS
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ needs.revision.outputs.short }}
          name: ${{ needs.revision.outputs.short }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: 'false'
          fail_on_unmatched_files: true
          files: |
            release/*.zip
            release/SHA256SUMS
          body: |
            CLI archives cover Linux arm64/amd64, macOS arm64, and Windows arm64/amd64. Verify downloads against SHA256SUMS, then extract the archive for your platform.
