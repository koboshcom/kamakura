services:
  core:
    build: .
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      DATA_DIR: /app/data
      WHATSAPP_AUTH_DIR: /app/auth
      PERSONA_PATH: /app/persona.md
      IMESSAGE_USE_BRIDGE: "true"
      BRIDGE_HOST: 0.0.0.0
      BRIDGE_PORT: "47621"
    ports:
      - "127.0.0.1:47621:47621"
    volumes:
      - memory:/app/data
      - whatsapp_auth:/app/auth
      - ./persona.md:/app/persona.md:ro
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    cpus: 2
    pids_limit: 256
volumes:
  memory:
  whatsapp_auth:
