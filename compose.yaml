services:
  core:
    build: .
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    networks: [default, mongo-internal]
    init: true
    env_file: .env
    environment:
      DATA_DIR: /app/data
      WHATSAPP_ENABLED: ${WHATSAPP_ENABLED:-false}
      WHATSAPP_AUTH_DIR: /run/kamakura-whatsapp
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-kamakura}
      PERSONA_PATH: /app/persona.md
      SANDBOX_IMAGE: ${SANDBOX_IMAGE:-kamakura-sandbox:local}
      DOCKER_SOCKET_PATH: /var/run/kamakura-sandbox.sock
      CORE_DOCKER_SOCKET_PATH: /var/run/docker.sock
      SANDBOX_ROOTFS_SIZE: ${SANDBOX_ROOTFS_SIZE:-}
      SANDBOX_EGRESS_IMAGE: ${SANDBOX_EGRESS_IMAGE:-kamakura-egress:local}
      SANDBOX_DENIED_IPS: ${SANDBOX_DENIED_IPS:-}
      SANDBOX_NETWORK_NAME: ${SANDBOX_NETWORK_NAME:-}
      SANDBOX_INSTANCE: ${SANDBOX_INSTANCE:-default}
      SANDBOX_DISK: ${SANDBOX_DISK:-35G}
      SANDBOX_CPUS: ${SANDBOX_CPUS:-2}
      SANDBOX_MEMORY: ${SANDBOX_MEMORY:-3g}
      SANDBOX_PIDS: ${SANDBOX_PIDS:-256}
      SANDBOX_IDLE_SECONDS: ${SANDBOX_IDLE_SECONDS:-1800}
      SANDBOX_COMMAND_TIMEOUT_SECONDS: ${SANDBOX_COMMAND_TIMEOUT_SECONDS:-30}
      SANDBOX_MAX_OUTPUT_BYTES: ${SANDBOX_MAX_OUTPUT_BYTES:-16000}
      SANDBOX_ROOT: ${SANDBOX_ROOT:-./sandboxes}
      SANDBOX_ROOT_VIEW: /app/sandboxes
      SANDBOX_ALLOW_SOFT_QUOTA: ${SANDBOX_ALLOW_SOFT_QUOTA:-false}
    ports:
      # Dedicated local service port. Operator's HTTPS proxy owns domains/TLS.
      - "${NOVNC_BIND_ADDRESS:-${DESKTOP_BIND_ADDRESS:-127.0.0.1}}:${NOVNC_PORT:-${DESKTOP_PORT:-47831}}:${NOVNC_PORT:-${DESKTOP_PORT:-47831}}"
      - "${LOCAL_DEVICES_BIND_ADDRESS:-127.0.0.1}:${LOCAL_DEVICES_PORT:-47943}:${LOCAL_DEVICES_PORT:-47943}"
    group_add:
      - "${DOCKER_GID:-0}"
    volumes:
      - ./data:/app/data
      # Provision child filesystem mounts BEFORE core starts.
      - ${SANDBOX_ROOT:-./sandboxes}:/app/sandboxes:ro
      - ./persona.md:/app/persona.md:ro
      - ./config:/app/config:ro
      # Core only. Never mounted into user sandboxes. This grants host-level power.
      - /var/run/docker.sock:/var/run/docker.sock
      # Same daemon by default, including Docker Desktop. Optional operator socket.
      - ${SANDBOX_DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/kamakura-sandbox.sock
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    cpus: 2
    pids_limit: 256
  mongo:
    # Official MongoDB-maintained Community image, pinned 8.0 stable major.
    image: ${MONGODB_IMAGE:-mongodb/mongodb-community-server:8.0-ubi8}
    restart: unless-stopped
    command: [mongod, --bind_ip_all]
    networks: [mongo-internal]
    volumes:
      - ./data/mongo:/data/db
    healthcheck:
      test: [CMD, mongosh, --quiet, --eval, "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 1g
    cpus: 1
  sandbox-image:
    profiles: [build]
    build:
      context: .
      dockerfile: deploy/sandbox.Dockerfile
    image: ${SANDBOX_IMAGE:-kamakura-sandbox:local}

  egress-image:
    profiles: [build]
    build:
      context: .
      dockerfile: deploy/egress-guard.Dockerfile
    image: ${SANDBOX_EGRESS_IMAGE:-kamakura-egress:local}

networks:
  mongo-internal:
    internal: true
