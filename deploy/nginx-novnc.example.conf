# Example only. Lucas/operator owns DNS, certificates and nginx deployment.
# Include within nginx's http {} context. Adjust paths/port/domain yourself.
map $http_upgrade $kamakura_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name vnc.kamakura.kobosh.com;
    # Fixed hostname avoids reflecting an arbitrary incoming Host header.
    return 308 https://vnc.kamakura.kobosh.com$request_uri;
    # Links contain bearer tokens. Never log their query strings.
    access_log off;
}

server {
    listen 443 ssl;
    server_name vnc.kamakura.kobosh.com;
    ssl_certificate /etc/letsencrypt/live/vnc.kamakura.kobosh.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vnc.kamakura.kobosh.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    # nginx error logs can include request URLs. Send these to a restricted,
    # short-retention destination, or use /dev/null as in this token-safe example.
    error_log /dev/null;

    location /desktop/ {
        proxy_pass http://127.0.0.1:47831;
        proxy_http_version 1.1;
        proxy_set_header Host vnc.kamakura.kobosh.com;
        proxy_set_header X-Forwarded-Host vnc.kamakura.kobosh.com;
        proxy_set_header X-Forwarded-Proto https;
        # Overwrite client-supplied forwarding data instead of appending it.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Forwarded "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $kamakura_upgrade;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        proxy_buffering off;
    }
    location / { return 404; }
}

# Future services use a different local port, their own <SERVICE>_PUBLIC_URL,
# their own server_name and their own authentication. Do not route unrelated
# applications through /desktop/ or share the noVNC listener/cookies.
